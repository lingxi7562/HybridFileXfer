plugins {
    id 'com.android.application'
}

// Optional release keystore. Supply it through the environment (CI secrets) or
// through gradle.properties to produce an installable release APK. Without it the
// release APK stays unsigned and the release workflow refuses to publish it.
def hfxKeystoreFile = System.getenv('HFX_KEYSTORE_FILE') ?: project.findProperty('HFX_KEYSTORE_FILE')
def hfxKeystorePassword = System.getenv('HFX_KEYSTORE_PASSWORD') ?: project.findProperty('HFX_KEYSTORE_PASSWORD')
def hfxKeyAlias = System.getenv('HFX_KEY_ALIAS') ?: project.findProperty('HFX_KEY_ALIAS')
def hfxKeyPassword = System.getenv('HFX_KEY_PASSWORD') ?: project.findProperty('HFX_KEY_PASSWORD')

android {
    namespace 'top.weixiansen574.hybridfilexfer'
    compileSdk 34
    ndkVersion '25.1.8937393'

    defaultConfig {
        //applicationId "com.antutu.ABenchMark" //改成此包名提升传输速度😆
        applicationId "top.weixiansen574.hybridfilexfer"
        minSdk 24
        targetSdk 34
        versionCode 301
        versionName "3.1.0 - beta"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"// 指定目标 CPU 架构
        }
    }

    signingConfigs {
        if (hfxKeystoreFile) {
            release {
                storeFile file(hfxKeystoreFile)
                storePassword hfxKeystorePassword
                keyAlias hfxKeyAlias
                keyPassword hfxKeyPassword
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt" // 指定 CMakeLists.txt 位置
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
        aidl = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hfxKeystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    /*implementation 'androidx.appcompat:appcompat:1.7.0'*/
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "io.github.l4digital:fastscroll:2.1.0"
    implementation "com.google.zxing:core:3.5.3"
}
