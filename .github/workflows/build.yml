name: Android cloud validation

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  merge_group:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.10.2.4988404 ndk;25.1.8937393'

      - name: Validate, test, and build Android and desktop artifacts
        working-directory: HybridFileXfer-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease :pc:jar

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.sha }}
          path: HybridFileXfer-Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 9

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            HybridFileXfer-Android/app/build/reports
            HybridFileXfer-Android/app/build/test-results
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload desktop client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-${{ github.sha }}
          path: HybridFileXfer-PC/build/libs/HybridFileXfer-PC.jar
          if-no-files-found: error
          compression-level: 9

      - name: Package Windows distribution
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          DIST="HybridFileXfer-windows-x64"
          rm -rf "$DIST" "HybridFileXfer-windows-x64.zip"
          mkdir -p "$DIST"
          cp HybridFileXfer-PC/build/libs/HybridFileXfer-PC.jar "$DIST/HybridFileXfer.jar"
          cp HybridFileXfer-PC/adb.exe HybridFileXfer-PC/AdbWinApi.dll HybridFileXfer-PC/AdbWinUsbApi.dll "$DIST/"
          cp HybridFileXfer-PC/HybridFileXferLauncher.exe "$DIST/" || true
          cp HybridFileXfer-PC/start.exe "$DIST/" || true
          cp "script/一键启动.bat" "$DIST/一键启动.bat"
          cp README.md "$DIST/README.md"
          zip -r "HybridFileXfer-windows-x64.zip" "$DIST"

      - name: Upload Windows distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HybridFileXfer-windows-x64-${{ github.sha }}
          path: HybridFileXfer-windows-x64.zip
          if-no-files-found: error
          compression-level: 9

      - name: Publish GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILES=(HybridFileXfer-windows-x64.zip)
          while IFS= read -r f; do
            FILES+=("$f")
          done < <(find HybridFileXfer-Android/app/build/outputs/apk -type f -name '*.apk' | sort)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --generate-notes
          fi
