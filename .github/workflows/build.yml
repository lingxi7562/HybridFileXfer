name: Android cloud validation

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.10.2.4988404 ndk;25.1.8937393'

      - name: Validate, test, and build Android and desktop artifacts
        working-directory: HybridFileXfer-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease :pc:jar

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.sha }}
          path: HybridFileXfer-Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 9

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            HybridFileXfer-Android/app/build/reports
            HybridFileXfer-Android/app/build/test-results
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload desktop client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-${{ github.sha }}
          path: HybridFileXfer-PC/build/libs/HybridFileXfer-PC.jar
          if-no-files-found: error
          compression-level: 9
